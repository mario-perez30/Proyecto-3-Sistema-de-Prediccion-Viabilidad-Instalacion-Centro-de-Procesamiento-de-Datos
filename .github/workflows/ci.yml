name: CI

# Se ejecuta en cada push a las ramas principales y en todos los Pull Request
# (también en los apilados, cuya base es otra rama de trabajo).
on:
  push:
    branches: [main, desarrollo]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Estilo (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - name: Lint
        run: ruff check src tests
      - name: Formato
        run: ruff format --check src tests

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Ejecutar tests (sin los que necesitan red)
        run: pytest -m "not red" --cov=cpd --cov-report=term-missing --cov-report=xml
      - name: Guardar informe de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage.xml
