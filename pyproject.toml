[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cpd-viabilidad"
version = "0.1.0"
description = "Plataforma Big Data para predecir la viabilidad de instalar un Centro de Procesamiento de Datos (CPD) en municipios españoles."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mario Pérez" }, { name = "Arnau Higueras" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "requests>=2.31",
    "pyarrow>=15",
    "duckdb>=1.0",
    "holidays>=0.50",
    "openpyxl>=3.1",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8", "pytest-cov>=5", "python-docx>=1.1"]

[project.scripts]
cpd = "cpd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["E501", "N803", "N806"]  # X e y son la convención en ML

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["red: necesita conexión a internet (API de REE); se omite en CI"]
